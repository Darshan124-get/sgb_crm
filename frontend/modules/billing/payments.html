<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Records | Billing | SGB Agro CRM</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --billing-primary: #3b82f6;
            --billing-secondary: #6366f1;
            --billing-accent: #f59e0b;
        }

        #btn-top-payment { display: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .main-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .billing-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
            min-width: 850px;
        }

        .billing-table th {
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .billing-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
            color: #1e293b;
            vertical-align: middle;
        }

        .billing-table tr:hover { background-color: #f8fafc; }

        .premium-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .topbar {
            background: white;
            padding: 1rem 2rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .search-bar {
            background: #f1f5f9;
            padding: 0.5rem 1.25rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 400px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.875rem;
        }

        .tabs-nav {
            display: flex;
            gap: 0.75rem;
            background: #e2e8f0;
            padding: 0.35rem;
            border-radius: 12px;
            width: fit-content;
        }

        .tab-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: #64748b;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--billing-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .btn-billing {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-billing.primary {
            background: var(--billing-primary);
            color: white;
        }

        .btn-billing.primary:hover {
            background: var(--billing-secondary);
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-verified {
            background: #dcfce7;
            color: #166534;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="hamburger" onclick="window.toggleMobileSidebar()">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearch" placeholder="Search payment customer, order ID..." oninput="filterPaymentsTable(this.value)">
                </div>
                <div class="profile-section">
                    <span class="profile-name" id="userName">Billing Officer</span>
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div style="padding: 1.5rem 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1 style="font-size: 1.85rem; color: #0f172a; font-weight: 800; margin: 0;">📋 Payment Records</h1>
                        <p style="color: #64748b; font-size: 0.875rem; margin-top: 4px;">Bank transfers, advance payments & verified customer transactions.</p>
                    </div>
                    <div class="tabs-nav">
                        <button class="tab-btn active" id="btnTabPending" onclick="switchPaymentSubTab('pending')">Pending</button>
                        <button class="tab-btn" id="btnTabVerified" onclick="switchPaymentSubTab('verified')">Verified</button>
                    </div>
                </div>

                <div class="premium-card" style="padding: 0; overflow-x: auto;">
                    <table class="billing-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Order ID</th>
                                <th>Amount</th>
                                <th>Mode</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsBody">
                            <tr>
                                <td colspan="7" style="text-align:center; padding: 3rem;">
                                    <div class="loader"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/components.js"></script>
    <script src="js/billing.js"></script>
    <script>
        let currentSubTab = 'pending';

        function switchPaymentSubTab(status) {
            currentSubTab = status;
            document.getElementById('btnTabPending').classList.toggle('active', status === 'pending');
            document.getElementById('btnTabVerified').classList.toggle('active', status === 'verified');
            loadPayments(status);
        }

        function filterPaymentsTable(query) {
            const term = (query || '').toLowerCase().trim();
            const rows = document.querySelectorAll('#paymentsBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        }
    </script>
</body>

</html>
