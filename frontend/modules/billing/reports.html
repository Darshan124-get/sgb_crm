<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Reports | SGB Agro CRM</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --billing-primary: #3b82f6;
            --billing-secondary: #6366f1;
            --billing-accent: #f59e0b;
        }

        #btn-top-payment { display: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .main-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .premium-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
            overflow: hidden;
            padding: 1.5rem;
        }

        .topbar {
            background: white;
            padding: 1rem 2rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .search-bar {
            background: #f1f5f9;
            padding: 0.5rem 1.25rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 400px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.875rem;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .report-stat-box {
            background: #f8fafc;
            border-radius: 14px;
            padding: 1.25rem;
            border: 1px solid #e2e8f0;
        }

        .report-stat-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        .report-stat-val {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
        }

        .billing-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .billing-table th {
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .billing-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
            color: #1e293b;
        }

        .btn-billing {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-billing.primary {
            background: var(--billing-primary);
            color: white;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="hamburger" onclick="window.toggleMobileSidebar()">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearch" placeholder="Search reports...">
                </div>
                <div class="profile-section">
                    <span class="profile-name" id="userName">Billing Officer</span>
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div style="padding: 1.5rem 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1 style="font-size: 1.85rem; color: #0f172a; font-weight: 800; margin: 0;">📊 Billing Reports</h1>
                        <p style="color: #64748b; font-size: 0.875rem; margin-top: 4px;">Revenue realization, GST liability, and Accounts Receivable performance.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn-billing primary" onclick="loadReports()">
                            <i class="fa-solid fa-rotate"></i> Refresh Data
                        </button>
                    </div>
                </div>

                <div id="reportsContent">
                    <div style="text-align:center; padding: 5rem;"><div class="loader"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/components.js"></script>
    <script src="js/billing.js"></script>
</body>

</html>
