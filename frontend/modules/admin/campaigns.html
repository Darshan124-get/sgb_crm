<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns | SGB Agro CRM</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .table-container {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 2rem;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 1rem;
            background: #f8fafc;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }
        .data-table td {
            padding: 1rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.875rem;
        }
        .action-btns button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            font-size: 1rem;
            color: #64748b;
            transition: color 0.2s;
        }
        .action-btns button:hover {
            color: var(--primary-color);
        }
        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-deactive { background: #fef2f2; color: #991b1b; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        /* Hide number input spinners */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body>
<div class="dashboard-wrapper">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <header class="topbar">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="globalSearch" placeholder="Search campaigns...">
            </div>
            <div class="profile-section">
                <span class="profile-name" id="profileName">Administrator</span>
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
            </div>
        </header>

        <div class="content-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
                <div>
                    <h1 style="font-size:1.5rem; font-weight:800; color:#1e293b; margin-bottom:0.25rem;">Campaign Management</h1>
                    <p style="color:#64748b; font-size:0.875rem;">Manage your operations campaigns.</p>
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button class="btn btn-outline" id="refreshDataBtn"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="btn" id="addCampaignBtn" style="background:var(--primary-color); color:white;">
                        <i class="fas fa-plus"></i> Create a Campaign
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Campaign ID</th>
                            <th>Tag Line / Text</th>
                            <th>Product Name</th>
                            <th>Ad Spend</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="campaignTableBody">
                        <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal Root -->
<div id="globalModal" class="modal"></div>

<script src="../../js/config.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/decision-engine.js"></script>
<script src="js/campaigns.js"></script>
</body>
</html>
