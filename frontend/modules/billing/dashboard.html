<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Dashboard | SGB Agro CRM</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --billing-primary: #3b82f6;
            --billing-secondary: #6366f1;
            --billing-accent: #f59e0b;
        }

        #btn-top-payment { display: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .main-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .premium-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
            overflow: hidden;
            padding: 1.5rem;
        }

        .topbar {
            background: white;
            padding: 1rem 2rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .search-bar {
            background: #f1f5f9;
            padding: 0.5rem 1.25rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 400px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.875rem;
        }

        .btn-billing {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-billing.primary {
            background: var(--billing-primary);
            color: white;
        }

        .filter-input-v2 {
            border: 1px solid #e2e8f0;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            color: #1e293b;
            font-weight: 600;
            outline: none;
            background: #f8fafc;
        }

        .billing-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .billing-table th {
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .billing-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
            color: #1e293b;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="hamburger" onclick="window.toggleMobileSidebar()">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearch" placeholder="Search orders, invoices, payments...">
                </div>
                <div class="profile-section">
                    <span class="profile-name" id="userName">Billing Officer</span>
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div style="padding: 1.5rem 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1 style="font-size: 1.85rem; color: #0f172a; font-weight: 800; margin: 0;">🏠 Billing Dashboard</h1>
                        <p style="color: #64748b; font-size: 0.875rem; margin-top: 4px;">Executive revenue metrics, collection status & Zoho Books analytics.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn-billing primary" onclick="refreshDashboard()">
                            <i class="fa-solid fa-rotate"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Filters Section -->
                <div style="background: white; border-radius: 16px; padding: 1.25rem; border: 1px solid #e2e8f0; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.02);">
                    <div style="display: flex; flex-direction: column; gap: 0.35rem; min-width: 150px; flex: 1;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #475569;">Date Range</label>
                        <select id="dashDateRange" class="filter-input-v2" onchange="refreshDashboard()">
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last_7_days">Last 7 Days</option>
                            <option value="this_month">This Month</option>
                            <option value="this_year">This Year</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.35rem; min-width: 150px; flex: 1;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #475569;">Billing User</label>
                        <select id="dashBillingUser" class="filter-input-v2" onchange="refreshDashboard()">
                            <option value="">All Users</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.35rem; min-width: 150px; flex: 1;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #475569;">Customer Type</label>
                        <select id="dashCustomerType" class="filter-input-v2" onchange="refreshDashboard()">
                            <option value="">All Types</option>
                            <option value="dealer">Dealer</option>
                            <option value="lead">Lead/Retail</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.35rem; min-width: 150px; flex: 1;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #475569;">Sales Executive</label>
                        <select id="dashSalesExecutive" class="filter-input-v2" onchange="refreshDashboard()">
                            <option value="">All Executives</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 50px;">
                        <button class="btn-billing primary" onclick="refreshDashboard()" style="height: 38px;">
                            <i class="fa-solid fa-filter"></i> Filter
                        </button>
                    </div>
                </div>

                <!-- 5 KPI Cards Row -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 2rem;" id="dashboardStatsRow">
                    <div style="text-align:center; grid-column: 1/-1; padding: 2rem;"><div class="loader"></div></div>
                </div>

                <!-- Graphs Section -->
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                    <!-- Revenue Trend -->
                    <div class="premium-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <h3 style="font-size: 1.1rem; color: #0f172a; font-weight: 700; margin: 0;">Revenue Trend</h3>
                            <select id="trendTimeframe" class="filter-input-v2" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" onchange="updateRevenueTrendChart()">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                            </select>
                        </div>
                        <div style="height: 280px; position: relative;">
                            <canvas id="revenueTrendChart"></canvas>
                        </div>
                    </div>

                    <!-- Payment Status Pie -->
                    <div class="premium-card">
                        <h3 style="font-size: 1.1rem; color: #0f172a; font-weight: 700; margin-bottom: 1.5rem;">Collections Breakdown</h3>
                        <div style="height: 280px; position: relative;">
                            <canvas id="statusDistributionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/components.js"></script>
    <script src="js/billing.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });
    </script>
</body>

</html>
