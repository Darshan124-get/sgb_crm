<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chatbot Flows | SGB Agro CRM</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="css/chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Flow List Overrides & Specific layout adjustments */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-row label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-row input, .form-row select, .form-row textarea {
            padding: 0.55rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar Container (Loaded dynamically via components.js) -->
        <div id="sidebar-container"></div>
        
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search flows by name or keywords..." id="flowSearch">
                </div>
                <div class="profile-section">
                    <span class="profile-name" id="profileName">Loading...</span>
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <!-- Page Body -->
            <div class="flows-container">
                <div class="flows-header">
                    <div>
                        <h1>WhatsApp Chatbot Flows</h1>
                        <p>Manage and configure entry keyword triggers and automated dialog branches.</p>
                    </div>
                    <button class="btn-primary" style="height: 2.25rem; font-size: 0.8rem; gap: 0.35rem; width: auto; padding: 0 1rem; border-radius: 0.5rem; display: flex; align-items: center;" onclick="openCreateModal()">
                        <i class="fa-solid fa-plus"></i> Create Flow
                    </button>
                </div>

                <!-- Flows list Table -->
                <div class="flows-table-card">
                    <table class="flows-table">
                        <thead>
                            <tr>
                                <th>Flow Name / Category</th>
                                <th>Trigger Type / Keywords</th>
                                <th>Active Version</th>
                                <th>Status</th>
                                <th>Last Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="flowsTableBody">
                            <!-- Items populated dynamically by flows.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Flow Modal -->
    <div class="create-modal" id="createModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Create Flow</h3>
                <button class="btn-action" style="border:none;" onclick="closeCreateModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="form-row">
                <label>Flow Name</label>
                <input type="text" id="flowName" placeholder="e.g. Full Set / Trolley Enquiry">
            </div>

            <div class="form-row">
                <label>Description</label>
                <textarea id="flowDesc" rows="2" placeholder="e.g. Agricultural machinery inquiry flow for WhatsApp"></textarea>
            </div>

            <div class="form-row">
                <label>Trigger Type</label>
                <select id="flowTrigger">
                    <option value="Keyword">Keyword Match</option>
                    <option value="Campaign">Campaign Ad Source</option>
                    <option value="Manual">Manual API Trigger</option>
                </select>
            </div>

            <div class="form-row">
                <label>Trigger Keywords (separated by comma)</label>
                <input type="text" id="flowKeywords" placeholder="e.g. trolley, full set, machine">
            </div>

            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.5rem;">
                <button class="btn-secondary" style="width:auto; padding:0.5rem 1rem;" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-primary" style="padding:0.5rem 1.25rem; font-size:0.875rem; border-radius:0.5rem;" onclick="submitCreateFlow()">Create Flow</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/components.js"></script>
    <script src="js/flows.js"></script>
</body>
</html>
